# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# React Native and Expo configuration
FLIPPER_VERSION=0.125.0
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=false
expo.jsEngine=hermes
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Kotlin configuration
KOTLIN_VERSION=1.9.22
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Signing configs
MYAPP_UPLOAD_STORE_FILE=lightawake_store.keystore
MYAPP_UPLOAD_KEY_ALIAS=KODA LightAwake
MYAPP_UPLOAD_STORE_PASSWORD=lightawake_keystore_v2
MYAPP_UPLOAD_KEY_PASSWORD=lightawake_keystore_v2

android.suppressUnsupportedCompileSdk=35

# ⚡️ Increase Gradle download timeouts and connection reliability
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.http.readTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.readTimeout=120000

# 🧠 Enable Gradle caching and parallel builds for faster builds
org.gradle.caching=true
org.gradle.parallel=true

android.experimental.androidTest.useUnifiedTestPlatform=false