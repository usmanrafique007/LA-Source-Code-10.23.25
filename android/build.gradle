// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.8.10'
    ext {
        androidXAnnotation = "1.1.0"
        androidXBrowser = "1.0.0"
        buildToolsVersion = "35.0.0"
        compileSdkVersion = 35
        firebaseIidVersion = "19.0.1"
        firebaseMessagingVersion = "+" // default: "21.1.0"
        googlePlayServicesAuthVersion = "19.2.0"
        googlePlayServicesVersion = "+"
        kotlinVersion = '1.8.10'
        mediaCompatVersion = "1.0.1"
        minSdkVersion = 24
        targetSdkVersion = 35
        supportLibVersion = "28.0.0"
        supportV4Version = "1.0.0"
        frescoVersion = findProperty('expo.frescoVersion') ?: '2.5.0'
        reactNativeVersion = "0.75.5"
        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        // ndkVersion = "23.1.7779620"
        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal() 
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.1.0')
        classpath('com.google.gms:google-services:4.3.15')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}


gradle.projectsEvaluated {

}

subprojects { subproject ->
    afterEvaluate {
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
            }
            repositories {
                maven {
                    url "${rootProject.projectDir}/../node_modules/react-native/android"
                    metadataSources { artifact(); mavenPom() }
                }
            }
        }
    }
}

allprojects {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
        google()
        maven {
            url("$rootDir/../node_modules/react-native/android")
            metadataSources {
                artifact()
                mavenPom()
            }
        }
        // React Native Maven repository - must be first for exclusive content
        exclusiveContent {
            filter {
                includeGroup "com.facebook.react"
            }
            forRepository {
                maven {
                    url "$rootDir/../node_modules/react-native/android"
                }
            }
        }
        maven { 
            url "$rootDir/../node_modules/react-native/android"
            metadataSources {
                artifact()
                mavenPom()
            }
        }
        maven { url "$rootDir/../node_modules/jsc-android/dist" } 
        maven { url "$rootDir/../node_modules" } 
        maven { url 'https://www.jitpack.io' }
        maven { url "https://maven.google.com" }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url "https://maven-other.tuya.com/repository/maven-releases/" }
        maven { url "https://maven-other.tuya.com/repository/maven-commercial-releases/" }
        maven { url 'https://central.maven.org/maven2/' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://developer.huawei.com/repo/' }
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}
