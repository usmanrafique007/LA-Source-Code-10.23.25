configurations.all {
    exclude group: "com.thingclips.smart" ,module: 'thingsmart-modularCampAnno'
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    // The React Native Gradle Plugin should provide react-android, but subprojects need it too
    // Add it explicitly so all projects can resolve it
    // implementation("com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}")

implementation project(':ReactAndroid')
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:${rootProject.ext.kotlin_version}")
    implementation 'com.google.firebase:firebase-analytics:17.3.0'
    implementation platform('com.google.firebase:firebase-bom:31.0.0')
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-iid:21.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.7.0'
    implementation project(':lottie-react-native')
    implementation project(':react-native-sound')
    implementation project(':react-native-push-notification')
    implementation project(':react-native-fbsdk-next')
    implementation project(':react-native-community_geolocation')
    implementation jscFlavor
    implementation("com.facebook.react:react-android:${REACT_NATIVE_VERSION}")




    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";
    def frescoVersion = rootProject.ext.frescoVersion

    // If your app supports Android versions before Ice Cream Sandwich (API level 14)
    if (isGifEnabled || isWebpEnabled) {
        implementation("com.facebook.fresco:fresco:${frescoVersion}")
        implementation("com.facebook.fresco:imagepipeline-okhttp3:${frescoVersion}")
    }

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${frescoVersion}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${frescoVersion}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${frescoVersion}")
        }
    }

    implementation 'org.jetbrains:annotations:16.0.2'

    // if (hermesEnabled.toBoolean()) {
    //     implementation("com.facebook.react:hermes-android")
    // } else {
    //     implementation jscFlavor
    // }
}

