// Override `hermesEnabled` by `expo.jsEngine`
// ext {
//   hermesEnabled = (findProperty('expo.jsEngine') ?: "hermes") == "hermes"
// }
ext {
  hermesEnabled = false
}


project.ext.react = [
    entryFile: "index.js",
    enableHermes: false,
    reactNativeDir: new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile(),
    // Disable native builds temporarily to allow Java compilation
    enableNativeBuild: false
]

// Configure React Native Gradle Plugin to use Android package name
react {
    // Provide package name from Android configuration
    def packageName = android.defaultConfig.applicationId ?: android.namespace
    if (packageName) {
        // This will be used by autolinking if needed
    }
}

// Ensure autolinking directory exists before tasks run
def autolinkingDir = new File(project.buildDir, "generated/autolinking")
def autolinkingFile = new File(autolinkingDir, "autolinking.json")
autolinkingDir.mkdirs()
if (!autolinkingFile.exists()) {
    autolinkingFile.text = '{"dependencies":[]}'
}

afterEvaluate {
    tasks.matching { 
        it.name.contains("generateAutolinking") || 
        it.name.contains("Autolinking") || 
        it.name.contains("generateReactNativeEntryPoint")
    }.configureEach {
        enabled = false
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.lightawakereimagined"
    defaultConfig {
        applicationId 'com.lightawakereimagined'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 169
        versionName "3.4.1"
        missingDimensionStrategy 'store', 'play'
        multiDexEnabled true
    ndk {
         abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
      }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
          release {
            storeFile file('lightawake_uploadkey_v2.jks')
            storePassword MYAPP_UPLOAD_STORE_PASSWORD
            keyAlias MYAPP_UPLOAD_KEY_ALIAS
            keyPassword MYAPP_UPLOAD_KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }


    packagingOptions {
        pickFirst 'lib/*/libc++_shared.so' 
        pickFirst '**/armeabi-v7a/libc++_shared.so'
        pickFirst '**/x86/libc++_shared.so'
        pickFirst '**/arm64-v8a/libc++_shared.so'
        pickFirst '**/x86_64/libc++_shared.so'
        pickFirst '**/x86/libjsc.so'
        pickFirst '**/armeabi-v7a/libjsc.so'
    }
