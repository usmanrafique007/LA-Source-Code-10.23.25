apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.facebook.react'

// -------------------- NEW: React CLI fix --------------------
def reactCliFile = rootProject.file("../node_modules/react-native/cli.js")
if (!reactCliFile.exists()) {
    throw new GradleException("React Native CLI not found at $reactCliFile")
}

project.ext.react = [
    cliFile: reactCliFile
]

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def expoDebuggableVariants = ['debug']
// Override `debuggableVariants` for expo-updates debugging
if (System.getenv('EX_UPDATES_NATIVE_DEBUG') == "1") {
  react {
    expoDebuggableVariants = []
  }
}



