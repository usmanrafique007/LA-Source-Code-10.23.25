rootProject.name = 'lightawake'

// ✅ Expo autolinking
apply from: "$rootDir/../node_modules/expo/scripts/autolinking.gradle"
useExpoModules()

// ✅ React Native autolinking
apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json')"]
    .execute(null, rootDir).text.trim(), "../native_modules.gradle")
applyNativeModulesSettingsGradle(settings)

// ✅ App module
include ':app'

// ✅ Gradle plugin reference
includeBuild('../node_modules/@react-native/gradle-plugin')
